<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사진 자동 생성</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="bg-overlay"></div>

  <header class="site-header">
    <div class="logo-area">
      <span class="logo-icon">&#9654;</span>
      <span class="logo-text">사진 자동 생성</span>
    </div>
    <p class="logo-sub">이미지 프롬프트 붙여넣기 → Gemini 자동 생성 → 사진1.png, 사진2.png...</p>
  </header>

  <main class="container">

    <!-- ── 입력 카드 ── -->
    <div class="card" id="inputCard">
      <div class="field" style="margin-bottom:0;">
        <label for="prompts">
          이미지 프롬프트 <span class="hint">(한 줄에 하나씩 — 순서대로 사진1, 사진2... 저장됩니다)</span>
        </label>
        <textarea id="prompts" class="script-input"
          placeholder="A cinematic 16:9 photorealistic scene of...&#10;A cinematic 16:9 photorealistic scene of...&#10;..."></textarea>
        <p id="charCountInput" class="char-count"></p>
      </div>
      <button id="genBtn" class="btn-primary" onclick="startGeneration()">
        &#10024; 이미지 자동 생성 시작
      </button>
    </div>

    <!-- ── 진행 상황 ── -->
    <div id="progressSection" class="hidden" style="margin-top:2rem;">
      <div class="card">
        <p id="taskText" class="task-text">준비 중...</p>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar" style="width:0%"></div>
        </div>
        <div class="progress-info">
          <span id="progressLabel">0 / 0</span>
          <span id="timeInfo" class="time-info"></span>
        </div>
      </div>
    </div>

    <!-- ── 결과 영역 ── -->
    <div id="resultSection" class="hidden" style="margin-top:2rem;">
      <div class="result-block" id="blockImages">
        <div class="result-block-header">
          <span class="result-block-icon">&#128247;</span> 생성된 이미지
        </div>
        <div id="imageList"></div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <p>Powered by Gemini Imagen &nbsp;|&nbsp; 인생이야기 자동화</p>
  </footer>

  <script src="/static/js/script.js"></script>
</body>
</html>
